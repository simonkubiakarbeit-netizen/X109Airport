     function computeStats() {

  const reports = getReports();

  const months = [...new Set(
    reports.map(r => (r.date || "").slice(0, 7))
  )].sort().reverse();

  const selectedMonth =
    window.selectedMonth ||
    months[0] ||
    new Date().toISOString().slice(0, 7);

  const filteredReports =
    reports.filter(r =>
      (r.date || "").startsWith(selectedMonth)
    );

  const perHour = {},
        perDay = {},
        perMonth = {},
        perHourL = {},
        perDayL = {},
        perMonthL = {},
        perHourLA = {},
        perDayLA = {},
        perMonthLA = {};

  let total = 0,
    totalL = 0,
    totalLA = 0,
    totalNon = 0,
    totalMUC = 0,
    totalIN = 0;

  filteredReports.forEach(r => {
  const date = r.date || '';
  const month = date.slice(0, 7);

  (r.fahrten || []).forEach(f => {

    const hour = f.uhrzeit || '';

    const isAusstieg =
      (f.richtung || '')
        .toLowerCase()
        .includes('ingolstadt');

    (f.halts || []).forEach(h => {

      const isL =
        (h.ortName || '')
          .toLowerCase()
          .includes('langenbruck');

      const cnt = h.istCount || 0;
      if (isAusstieg)
  totalIN += cnt;
else
  totalMUC += cnt;
      if (isL) {

        if (isAusstieg) {

          totalLA += cnt;

          perHourLA[hour] =
            (perHourLA[hour] || 0) + cnt;

          perDayLA[date] =
            (perDayLA[date] || 0) + cnt;

          perMonthLA[month] =
            (perMonthLA[month] || 0) + cnt;

        } else {

          totalL += cnt;

          perHourL[hour] =
            (perHourL[hour] || 0) + cnt;

          perDayL[date] =
            (perDayL[date] || 0) + cnt;

          perMonthL[month] =
            (perMonthL[month] || 0) + cnt;

          total += cnt;

          perHour[hour] =
            (perHour[hour] || 0) + cnt;

          perDay[date] =
            (perDay[date] || 0) + cnt;

          perMonth[month] =
            (perMonth[month] || 0) + cnt;
        }

      } else {

        totalNon += cnt;
        total += cnt;

        perHour[hour] =
          (perHour[hour] || 0) + cnt;

        perDay[date] =
          (perDay[date] || 0) + cnt;

        perMonth[month] =
          (perMonth[month] || 0) + cnt;
      }

    });

  });

});
  const uniqueDays = [...new Set(
    filteredReports.map(r => r.date)
  )];

  const avgDay =
    uniqueDays.length
      ? (total / uniqueDays.length).toFixed(1)
      : 0;

  const hourValues = Object.values(perHour);

  const avgHour =
    hourValues.length
      ? (
          hourValues.reduce((a,b)=>a+b,0) /
          hourValues.length
        ).toFixed(1)
      : 0;

  const bestHourEntry =
    Object.entries(perHour)
      .sort((a,b)=>b[1]-a[1])[0];

  const bestDayEntry =
    Object.entries(perDay)
      .sort((a,b)=>b[1]-a[1])[0];

  return {
    perHour,
    perDay,
    perMonth,

    perHourL,
    perDayL,
    perMonthL,

    perHourLA,
    perDayLA,
    perMonthLA,

    total,
    totalL,
    totalLA,
    totalNon,

    totalMUC,
    totalIN,

    avgDay,
    avgHour,

    bestHour: bestHourEntry
      ? `${bestHourEntry[0]} (${bestHourEntry[1]})`
      : "-",

    bestDay: bestDayEntry
      ? `${bestDayEntry[0]} (${bestDayEntry[1]})`
      : "-",

    months,
    selectedMonth,

    count: filteredReports.length
  };
}
      function exportExcel() {

  <script>
    (function () {
      const DOC_KEY = 'x109-dokumente';
      const FAHRER_ID = 'fahrer-dok-box';
      function getDocs() { try { return window.DOKS_CACHE || [] } catch (e) { return [] } }
      window.DOKS_CACHE = window.DOKS_CACHE || [];
      // Lade Dokumente aus Supabase
      try {
        db.from("dokumente").select("*").then(({data}) => {
          if(data) { window.DOKS_CACHE = data.map(r=>r.data); }
        });
      } catch(e) {}

      function getHeader() { const h = document.querySelector('header'); return h ? (h.innerText || '') : ''; }
      function isFahrer() {
        const ht = (getHeader() || '').toLowerCase();
        if (ht.includes('admin') || ht.includes('dispo')) return false;
        // Wenn Dashboard Button existiert = Admin/Dispo, nicht Fahrer
        const hasDashboard = Array.from(document.querySelectorAll('button')).some(b => (b.textContent || '').toLowerCase().includes('dashboard'));
        if (hasDashboard) return false;
        return true;
      }
      function renderFahrerDocs() {
        const existing = document.getElementById(FAHRER_ID);
        if (!isFahrer()) {
          if (existing) existing.remove();
          return;
        }
        const main = document.querySelector('main'); if (!main) return;
        const docs = getDocs();
        let box = existing;
        if (!box) {
          box = document.createElement('div'); box.id = FAHRER_ID; box.className = 'bg-white rounded-2xl border p-4 mt-4';
          // ganz oben einfügen beim Fahrer
          main.prepend(box);
        }
        let inner = '<h3 style="font-weight:900;font-size:16px">📄 Dokumente für Kontrolle</h3><p style="font-size:12px;color:#71717a;margin-top:4px">Hier findest du Versicherung, Zulassung etc. für Kontrollen.</p>';
        if (docs.length === 0) {
          inner += '<div style="margin-top:12px;font-size:13px;color:#71717a;padding:12px;border:1px dashed #e4e4e7;border-radius:12px">Keine Dokumente hinterlegt.</div>';
        } else {
          inner += '<div style="margin-top:12px;display:grid;gap:10px">';
          docs.forEach(d => {
            inner += `<div style="display:flex;gap:12px;align-items:center;border:1px solid #e4e4e7;border-radius:12px;padding:12px;background:#fafafa"><div style="font-size:24px">📄</div><div style="flex:1"><div style="font-weight:800;font-size:14px">${d.title || d.name}</div><div style="font-size:11px;color:#71717a">${d.name}</div></div><a href="${d.data}" download="${d.name}" target="_blank" style="height:40px;padding:0 16px;border:1px solid #e4e4e7;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;text-decoration:none;color:black;background:white">Öffnen / Download</a></div>`;
          });
          inner += '</div>';
        }
        box.innerHTML = inner;
      }
      setInterval(renderFahrerDocs, 800);
    })();
  </script>
